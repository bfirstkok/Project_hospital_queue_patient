name: Patient portal CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PATIENT_API_BASE_URL: https://hospital.bfirstkok.me
          PATIENT_STATUS_REFRESH_MS: "10000"
          PATIENT_GOOGLE_CLIENT_ID: ""
        run: npm run build
