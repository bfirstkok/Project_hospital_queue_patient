<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1480" viewBox="0 0 1920 1480" role="img" aria-labelledby="title description">
  <title id="title">ระบบคิวผู้ป่วย OPD ทำงานอย่างไร</title>
  <desc id="description">Flow chart แสดงการลงทะเบียน ตรวจคิวเดิม ออกบัตรคิว ติดตามสถานะ และลำดับการรับบริการของผู้ป่วย</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123451"/>
      <stop offset="1" stop-color="#1D5872"/>
    </linearGradient>
    <linearGradient id="patient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F5FF"/>
      <stop offset="1" stop-color="#F4FAFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#18314A" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#55718C"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#15938B"/>
    </marker>
    <marker id="arrowStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#55718C"/>
    </marker>
    <style>
      text { font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; fill: #18314A; }
      .title { font-size: 48px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { font-size: 23px; fill: #D7E8F1; }
      .section { font-size: 27px; font-weight: 750; }
      .eyebrow { font-size: 16px; font-weight: 750; letter-spacing: 1px; }
      .node-title { font-size: 24px; font-weight: 750; }
      .body { font-size: 20px; fill: #38516A; }
      .small { font-size: 17px; fill: #597189; }
      .tiny { font-size: 15px; fill: #6C8195; }
      .step-title { font-size: 20px; font-weight: 700; }
      .white { fill: #FFFFFF; }
      .line { fill: none; stroke: #55718C; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .line-teal { fill: none; stroke: #15938B; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
      .line-dash { fill: none; stroke: #71869B; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1480" fill="#F3F7FA"/>
  <rect x="0" y="0" width="1920" height="145" fill="url(#header)"/>
  <circle cx="1805" cy="15" r="160" fill="#FFFFFF" opacity="0.035"/>
  <circle cx="1720" cy="155" r="95" fill="#75D5C8" opacity="0.09"/>
  <text x="72" y="69" class="title white">ระบบคิวผู้ป่วย OPD ทำงานอย่างไร</text>
  <text x="76" y="112" class="subtitle">ตั้งแต่ลงทะเบียน รับเลขคิว ติดตามสถานะ จนจบการรับบริการ</text>
  <rect x="1530" y="45" width="310" height="48" rx="24" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="1560" cy="69" r="6" fill="#76E0CF"/>
  <text x="1580" y="76" class="eyebrow white">ภาพรวมจากระบบปัจจุบัน</text>

  <!-- Registration and queue issuance -->
  <rect x="48" y="168" width="1824" height="464" rx="28" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="88" cy="211" r="20" fill="#E8F4F5"/>
  <text x="88" y="218" text-anchor="middle" class="eyebrow" fill="#137C78">01</text>
  <text x="122" y="220" class="section">ลงทะเบียนและรับคิว</text>
  <text x="1760" y="217" text-anchor="end" class="small">เริ่มจากผู้ป่วย แล้วส่งข้อมูลต่อไปยังเว็บและ API</text>

  <rect x="83" y="250" width="300" height="38" rx="19" fill="#E6F3FF"/>
  <circle cx="105" cy="269" r="5" fill="#2882C7"/>
  <text x="120" y="275" class="eyebrow" fill="#246C9E">ผู้ป่วย</text>
  <rect x="431" y="250" width="350" height="38" rx="19" fill="#F0ECFF"/>
  <circle cx="453" cy="269" r="5" fill="#7356C8"/>
  <text x="468" y="275" class="eyebrow" fill="#684EAE">เว็บ Queue</text>
  <rect x="1127" y="250" width="315" height="38" rx="19" fill="#E3F7F3"/>
  <circle cx="1149" cy="269" r="5" fill="#15938B"/>
  <text x="1164" y="275" class="eyebrow" fill="#12776F">API / Backend</text>
  <rect x="1500" y="250" width="320" height="38" rx="19" fill="#FFF1E5"/>
  <circle cx="1522" cy="269" r="5" fill="#DE8739"/>
  <text x="1537" y="275" class="eyebrow" fill="#A95E20">บัตรคิวในเว็บ</text>

  <rect x="83" y="310" width="300" height="190" rx="22" fill="url(#patient)" stroke="#C9E2F4" stroke-width="2"/>
  <circle cx="119" cy="350" r="17" fill="#2D83C5"/>
  <text x="119" y="357" text-anchor="middle" class="eyebrow white">1</text>
  <text x="150" y="358" class="node-title">ให้ข้อมูลผู้ป่วย</text>
  <text x="112" y="405" class="body">• ยินยอม PDPA</text>
  <text x="112" y="439" class="body">• กรอกประวัติและอาการ</text>
  <text x="112" y="473" class="small">ผู้ใช้เดิมเข้าสู่ระบบแล้วจองคิวได้</text>

  <path d="M383 405 H423" class="line"/>

  <rect x="431" y="310" width="350" height="190" rx="22" fill="#F5F2FF" stroke="#DDD5F8" stroke-width="2"/>
  <circle cx="467" cy="350" r="17" fill="#7356C8"/>
  <text x="467" y="357" text-anchor="middle" class="eyebrow white">2</text>
  <text x="498" y="358" class="node-title">เว็บตรวจข้อมูล</text>
  <text x="460" y="405" class="body">ตรวจความครบถ้วนของแบบฟอร์ม</text>
  <text x="460" y="439" class="body">แล้วเช็กว่ามีคิวที่ยังใช้งานอยู่ไหม</text>
  <text x="460" y="473" class="small">ช่วยป้องกันการออกคิวซ้ำ</text>

  <path d="M781 405 H795" class="line"/>
  <polygon points="900,311 1008,405 900,499 792,405" fill="#FFF9E8" stroke="#E8C96B" stroke-width="3"/>
  <text x="900" y="396" text-anchor="middle" class="node-title" font-size="21">มีคิวที่ยัง</text>
  <text x="900" y="428" text-anchor="middle" class="node-title" font-size="21">รับบริการอยู่?</text>

  <path d="M958 354 C1002 320 1050 326 1104 352" class="line-teal"/>
  <rect x="1007" y="306" width="51" height="30" rx="15" fill="#E5F6F2"/>
  <text x="1032" y="327" text-anchor="middle" class="eyebrow" fill="#12776F">มี</text>
  <rect x="1127" y="300" width="315" height="120" rx="20" fill="#E9F8F4" stroke="#B8E7DC" stroke-width="2"/>
  <text x="1154" y="341" class="node-title" fill="#147E73">เปิดคิวเดิม</text>
  <text x="1154" y="376" class="body">ใช้เลขคิวที่ยังรับบริการอยู่</text>
  <text x="1154" y="403" class="small">ไม่สร้างคิวซ้ำ</text>

  <path d="M958 456 C1002 490 1045 510 1104 520" class="line"/>
  <rect x="1007" y="474" width="66" height="30" rx="15" fill="#EDF2F6"/>
  <text x="1040" y="495" text-anchor="middle" class="eyebrow">ไม่มี</text>
  <rect x="1127" y="452" width="315" height="145" rx="20" fill="#F0FAF9" stroke="#BFE9E2" stroke-width="2"/>
  <text x="1154" y="491" class="node-title" fill="#147E73">ส่งให้ API ออกคิว</text>
  <text x="1154" y="526" class="body">บันทึกข้อมูลและสร้างหมายเลขคิว</text>
  <text x="1154" y="558" class="small">ตอบกลับ Token + ข้อมูลคิว</text>
  <text x="1154" y="584" class="tiny">สมัครใหม่ตั้ง PIN ก่อนติดตามคิว</text>

  <path d="M1442 360 H1480" class="line-teal"/>
  <path d="M1442 524 C1465 524 1457 450 1480 450" class="line-teal"/>
  <rect x="1480" y="330" width="340" height="198" rx="23" fill="#FFF5EA" stroke="#F1D1B2" stroke-width="2"/>
  <circle cx="1517" cy="370" r="17" fill="#DA8135"/>
  <text x="1517" y="377" text-anchor="middle" class="eyebrow white">3</text>
  <text x="1548" y="378" class="node-title" fill="#9D5B25">แสดงบัตรคิว</text>
  <text x="1510" y="421" class="body">เลขคิว • ลำดับคิว • ห้องตรวจ</text>
  <text x="1510" y="455" class="body">สถานะและคำแนะนำล่าสุด</text>
  <line x1="1510" y1="477" x2="1790" y2="477" stroke="#EBD7C4" stroke-width="2"/>
  <text x="1510" y="507" class="small">คิวเดิมและคิวใหม่ไปหน้าติดตามเดียวกัน</text>

  <!-- Live queue tracking -->
  <rect x="48" y="658" width="1824" height="426" rx="28" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="88" cy="702" r="20" fill="#E8F4F5"/>
  <text x="88" y="709" text-anchor="middle" class="eyebrow" fill="#137C78">02</text>
  <text x="122" y="711" class="section">ติดตามสถานะคิว</text>
  <text x="1760" y="708" text-anchor="end" class="small">เมื่อสถานะที่โรงพยาบาลเปลี่ยน เว็บจะดึงข้อมูลมาอัปเดตบัตรคิว</text>

  <rect x="84" y="760" width="365" height="188" rx="22" fill="#FFF5EA" stroke="#F1D6BB" stroke-width="2"/>
  <rect x="108" y="780" width="130" height="30" rx="15" fill="#FBE8D7"/>
  <text x="173" y="801" text-anchor="middle" class="eyebrow" fill="#A95E20">โรงพยาบาล</text>
  <text x="108" y="846" class="node-title">จุดบริการอัปเดตคิว</text>
  <text x="108" y="881" class="body">เช่น วัดสัญญาณชีพหรือเรียกเข้าห้อง</text>
  <text x="108" y="916" class="small">ข้อมูลสถานะถูกส่งเข้าระบบคิว</text>

  <path d="M449 854 H501" class="line-teal"/>

  <rect x="509" y="760" width="365" height="188" rx="22" fill="#EAF8F6" stroke="#BFE9E2" stroke-width="2"/>
  <rect x="533" y="780" width="150" height="30" rx="15" fill="#D6F1EC"/>
  <text x="608" y="801" text-anchor="middle" class="eyebrow" fill="#12776F">API / Backend</text>
  <text x="533" y="846" class="node-title" fill="#147E73">เก็บสถานะล่าสุด</text>
  <text x="533" y="881" class="body">เลขคิว • ลำดับ • ห้องตรวจ</text>
  <text x="533" y="916" class="small">พร้อมคำแนะนำและขั้นตอนบริการ</text>

  <path d="M874 827 H981" fill="none" stroke="#55718C" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#arrowStart)" stroke-linecap="round"/>
  <rect x="888" y="784" width="80" height="28" rx="14" fill="#F3F7FA"/>
  <text x="928" y="804" text-anchor="middle" class="tiny">เรียก ↔ ตอบ</text>

  <rect x="989" y="760" width="365" height="188" rx="22" fill="#F2F0FF" stroke="#DCD5F6" stroke-width="2"/>
  <rect x="1013" y="780" width="134" height="30" rx="15" fill="#E6E0FC"/>
  <text x="1080" y="801" text-anchor="middle" class="eyebrow" fill="#684EAE">เว็บ Queue</text>
  <text x="1013" y="846" class="node-title">ดึงสถานะคิวอัตโนมัติ</text>
  <text x="1013" y="881" class="body">โหลดทันที แล้ววนทุก ~10 วินาที*</text>
  <text x="1013" y="916" class="small">รีเฟรชเบื้องหลัง ไม่บังหน้าจอ</text>

  <path d="M1354 854 H1406" class="line"/>

  <rect x="1414" y="760" width="406" height="188" rx="22" fill="url(#patient)" stroke="#C9E2F4" stroke-width="2"/>
  <rect x="1438" y="780" width="117" height="30" rx="15" fill="#E6F3FF"/>
  <text x="1496" y="801" text-anchor="middle" class="eyebrow" fill="#246C9E">ผู้ป่วย</text>
  <text x="1438" y="846" class="node-title">เห็นข้อมูลล่าสุด</text>
  <text x="1438" y="881" class="body">สถานะ • ลำดับคิว • ห้องตรวจ</text>
  <text x="1438" y="916" class="small">ทำตามคำแนะนำบนบัตรคิว</text>

  <rect x="989" y="969" width="831" height="78" rx="18" fill="#FFF9E8" stroke="#E9D58B" stroke-width="2"/>
  <circle cx="1022" cy="1008" r="17" fill="#F1C954"/>
  <path d="M1015 1005 Q1022 997 1029 1005 M1018 1012 Q1022 1008 1026 1012" fill="none" stroke="#705611" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1052" y="1001" class="body" font-weight="700">แจ้งเสียง + สั่น เมื่อเปิดแจ้งเตือนไว้</text>
  <text x="1052" y="1030" class="small">เมื่อเหลือ 1–3 คิว หรือระบบกำลังเรียก/แจ้งให้ไปห้องตรวจ</text>

  <path d="M1170 760 C1170 725 1170 730 1170 713" class="line-dash"/>
  <path d="M1170 713 C1170 690 850 690 850 752" class="line-dash"/>
  <rect x="835" y="688" width="195" height="29" rx="14" fill="#FFFFFF"/>
  <text x="932" y="708" text-anchor="middle" class="tiny">เปิดหน้าคิวไว้ = วนตรวจซ้ำ</text>

  <!-- Hospital service stages -->
  <rect x="48" y="1110" width="1824" height="325" rx="28" fill="#FFFFFF" stroke="#DDE7EE" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="88" cy="1153" r="20" fill="#E8F4F5"/>
  <text x="88" y="1160" text-anchor="middle" class="eyebrow" fill="#137C78">03</text>
  <text x="122" y="1162" class="section">ลำดับรับบริการ</text>
  <text x="1760" y="1159" text-anchor="end" class="small">เว็บแสดงความคืบหน้าตามข้อมูลการเดินทางผู้ป่วยจาก Backend</text>

  <g filter="url(#shadow)">
    <rect x="82" y="1200" width="220" height="104" rx="18" fill="#EAF8F6" stroke="#BFE9E2" stroke-width="2"/>
    <rect x="337" y="1200" width="220" height="104" rx="18" fill="#F4F1FF" stroke="#DCD5F6" stroke-width="2"/>
    <rect x="592" y="1200" width="220" height="104" rx="18" fill="#F4F1FF" stroke="#DCD5F6" stroke-width="2"/>
    <rect x="847" y="1200" width="220" height="104" rx="18" fill="#FFF5EA" stroke="#F1D6BB" stroke-width="2"/>
    <rect x="1102" y="1200" width="220" height="104" rx="18" fill="#F7F8FA" stroke="#DDE5EB" stroke-width="2"/>
    <rect x="1357" y="1200" width="220" height="104" rx="18" fill="#F7F8FA" stroke="#DDE5EB" stroke-width="2"/>
    <rect x="1612" y="1200" width="220" height="104" rx="18" fill="#EAF8F6" stroke="#BFE9E2" stroke-width="2"/>
  </g>
  <g>
    <circle cx="108" cy="1228" r="14" fill="#15938B"/><text x="108" y="1234" text-anchor="middle" class="tiny white">1</text>
    <text x="192" y="1260" text-anchor="middle" class="step-title">จองคิว</text>
    <circle cx="363" cy="1228" r="14" fill="#7356C8"/><text x="363" y="1234" text-anchor="middle" class="tiny white">2</text>
    <text x="447" y="1260" text-anchor="middle" class="step-title">ตรวจร่างกาย</text>
    <circle cx="618" cy="1228" r="14" fill="#7356C8"/><text x="618" y="1234" text-anchor="middle" class="tiny white">3</text>
    <text x="702" y="1260" text-anchor="middle" class="step-title">รอห้องตรวจ</text>
    <circle cx="873" cy="1228" r="14" fill="#DA8135"/><text x="873" y="1234" text-anchor="middle" class="tiny white">4</text>
    <text x="957" y="1260" text-anchor="middle" class="step-title">เข้าตรวจ</text>
    <circle cx="1128" cy="1228" r="14" fill="#7A8FA2"/><text x="1128" y="1234" text-anchor="middle" class="tiny white">5</text>
    <text x="1212" y="1260" text-anchor="middle" class="step-title">ชำระเงิน</text>
    <circle cx="1383" cy="1228" r="14" fill="#7A8FA2"/><text x="1383" y="1234" text-anchor="middle" class="tiny white">6</text>
    <text x="1467" y="1260" text-anchor="middle" class="step-title">จ่ายยา</text>
    <circle cx="1638" cy="1228" r="14" fill="#15938B"/><text x="1638" y="1234" text-anchor="middle" class="tiny white">7</text>
    <text x="1722" y="1260" text-anchor="middle" class="step-title">เสร็จสิ้น</text>
  </g>
  <path d="M304 1252 H325 M559 1252 H580 M814 1252 H835 M1069 1252 H1090 M1324 1252 H1345 M1579 1252 H1600" class="line"/>
  <text x="960" y="1354" text-anchor="middle" class="small">* รอบดึงข้อมูลปรับได้ตามค่าระบบ · ขั้นชำระเงินและจ่ายยาแสดงเมื่อ Backend โรงพยาบาลส่งสถานะมา</text>
  <text x="960" y="1401" text-anchor="middle" class="tiny">ระบบคิวผู้ป่วย OPD • Patient Portal</text>
</svg>
